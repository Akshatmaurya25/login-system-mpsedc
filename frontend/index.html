<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Access</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro-panel">
        <p class="eyebrow">Account access</p>
        <h1>Welcome back.</h1>
        <p class="intro-copy">Create an account or sign in to continue.</p>
      </section>

      <section class="auth-panel">
        <div class="tabs" role="tablist" aria-label="Account actions">
          <button class="tab active" type="button" data-form="login-form">Login</button>
          <button class="tab" type="button" data-form="register-form">Register</button>
        </div>

        <form id="login-form" class="auth-form">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required />

          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />

          <button class="submit-button" type="submit">Sign in</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label for="register-name">Name</label>
          <input id="register-name" name="name" type="text" autocomplete="name" required />

          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" autocomplete="email" required />

          <label for="register-mobile">Mobile</label>
          <input id="register-mobile" name="mobile" type="tel" autocomplete="tel" required />

          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" minlength="8" autocomplete="new-password" required />

          <button class="submit-button" type="submit">Create account</button>
        </form>

        <section id="profile-panel" class="profile-panel hidden" aria-live="polite">
          <div class="profile-heading">
            <p class="eyebrow">Signed in</p>
            <h2>Your account</h2>
          </div>

          <dl class="profile-details">
            <div>
              <dt>Name</dt>
              <dd id="profile-name"></dd>
            </div>
            <div>
              <dt>Email</dt>
              <dd id="profile-email"></dd>
            </div>
            <div>
              <dt>Mobile</dt>
              <dd id="profile-mobile"></dd>
            </div>
          </dl>

          <label for="profile-token">JWT token</label>
          <textarea id="profile-token" class="token-field" rows="5" readonly></textarea>
          <button id="logout-button" class="logout-button" type="button">Log out</button>
        </section>

        <p id="status" class="status" role="status"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
